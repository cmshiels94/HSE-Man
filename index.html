/* ---------- level ---------- */
const map=Array.from({length:12},()=>Array(LW).fill(0));
const gaps=[[16,18],[30,33],[48,50],[64,67],[82,84],[96,99]];

const plats=[[10,7,3],[22,7,4],[26,5,3],[36,8,3],[40,6,4],[55,7,3],[58,5,3],[72,7,4],[77,5,3],[88,7,3],[102,7,4],[106,5,3]];

const I=[];
plats.forEach(([x,y,n])=>{for(let i=0;i<n;i++)I.push([x+i,y-1]);});
for(let x=6;x<LW-6;x+=7)if(!gaps.some(g=>x>=g[0]-1&&x<=g[1]))I.push([x,9]);
gaps.forEach(g=>I.push([g[0]+(g[1]-g[0]-1)/2,7.5]));
const CPS=[0,40,80],GOALX=(LW-3)*T;

const PRIEST=["....GGGG....","...GGGGGG...","...GSSSSG...","...SKSSKS...","...SSSSSS...","....SRRS....","....WWWW....","..KKKWWKKK..",".KKKKYKKKKK.",".KKKKYYKKKK.",".SKKKYKKKKS.","..KKKKKKKK..","..KKKKKKKK..","..KKKKKKKK..","..KKKKKKKK..","..KKK..KKK.."];

function spr(rows,pal,x,y,s,flip){rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const ch=r[flip?r.length-1-i:i];if(ch!='.'){c.fillStyle=pal[ch];c.fillRect(Math.round(x+i*s),Math.round(y+j*s),s,s);}}});}
/* ---------- audio ---------- */
let ac;function beep(f,d,type='square'){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
/* ---------- input ---------- */
const keys={};let state='title';
addEventListener('keydown',e=>{keys[e.code]=1;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code=='Enter')startIf();});
addEventListener('keyup',e=>keys[e.code]=0);
function startIf(){if(state=='title'||state=='over'||state=='win')reset(true);}
cv.addEventListener('pointerdown',()=>{cv.focus();startIf();});
document.querySelectorAll('#pad button').forEach(b=>{const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1;startIf();});
 ['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,()=>keys[k]=0));});
/* ---------- state ---------- */
let lives=5,score=0,pills=0,cp=0,t=0,deathT=0,p,enemies,items=[];
function reset(full){
 if(full){lives=5;score=0;pills=0;cp=0;items=I.map(q=>({x:q[0]*T+8,y:q[1]*T+8,got:0}));}
 enemies=E.map(([tx,ty])=>({x:tx*T,y:ty*T-26,w:56,h:26,dir:-1,alive:1,sq:0}));
 p={x:cp*T+20,y:8*T,vx:0,vy:0,w:20,h:30,on:0,face:1};state='play';
}
function die(){if(state!='play')return;lives--;state='dead';deathT=0;p.vy=-9;beep(150,.5,'sawtooth');}
const solid=(px,py)=>{const tx=Math.floor(px/T),ty=Math.floor(py/T);if(tx<0||tx>=LW)return true;if(ty<0||ty>=12)return false;return map[ty][tx]>0;};
const hits=b=>solid(b.x,b.y)||solid(b.x+b.w-1,b.y)||solid(b.x,b.y+b.h-1)||solid(b.x+b.w-1,b.y+b.h-1)||solid(b.x,b.y+b.h/2)||solid(b.x+b.w-1,b.y+b.h/2);
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
/* ---------- update ---------- */
function update(){
 t++;
 if(state=='dead'||state=='over'){deathT++;if(state=='dead'){p.vy+=.5;p.y+=p.vy;if(deathT>120){if(lives>0)reset(false);else state='over';}}return;}
 if(state!='play')return;
 const L=keys.ArrowLeft||keys.KeyA,R=keys.ArrowRight||keys.KeyD,J=keys.Space||keys.ArrowUp||keys.KeyW;
 p.vx=((R?1:0)-(L?1:0))*3.2;if(p.vx)p.face=p.vx>0?1:-1;
 if(J&&p.on){p.vy=-10.5;p.on=0;beep(520,.1);}
 if(!J&&p.vy<-4)p.vy=-4;
 p.vy=Math.min(p.vy+.5,12);
 p.x+=p.vx;while(p.vx&&hits(p))p.x-=Math.sign(p.vx);
 p.y+=p.vy;p.on=0;
 if(hits(p)){if(p.vy>0)p.on=1;while(hits(p))p.y-=Math.sign(p.vy);p.vy=0;}
 if(p.y>H+40)die();
 for(let i=CPS.length-1;i>=0;i--)if(p.x/T>CPS[i]+1){cp=Math.max(cp,CPS[i]);break;}
 for(const e of enemies){
  if(!e.alive){if(e.sq>0)e.sq--;continue;}
  e.x+=e.dir;const ax=e.dir>0?e.x+e.w+1:e.x-1;
  if(solid(ax,e.y+e.h/2)||!solid(ax,e.y+e.h+2))e.dir*=-1;
  if(state=='play'&&ov(p,e)){
   if(p.vy>0&&p.y+p.h-e.y<18){e.alive=0;e.sq=30;p.vy=-7;score+=100;beep(700,.1);}else die();
  }
 }
 for(const q of items)if(!q.got&&Math.abs(p.x+10-q.x-8)<16&&Math.abs(p.y+15-q.y-8)<22){q.got=1;pills++;score+=10;beep(900,.06);}
 if(p.x>GOALX){state='win';beep(660,.3);}
}
/* ---------- draw ---------- */
function txt(s,x,y,sz,col='#fff',al='left'){c.font='bold '+sz+'px monospace';c.textAlign=al;c.fillStyle='#0008';c.fillText(s,x+2,y+2);c.fillStyle=col;c.fillText(s,x,y);}
function draw(){
 const cam=Math.max(0,Math.min((p?p.x:0)-W/3,LW*T-W));
 c.fillStyle='#cfe9ee';c.fillRect(0,0,W,H);
 c.fillStyle='#e8f4f4';c.fillRect(0,0,W,200);c.fillStyle='#9fcbd2';c.fillRect(0,200,W,120);
 c.fillStyle='#b9d3d8';c.fillRect(0,0,W,14);
 for(let i=0;i<LW/5;i++){const x=i*5*T-cam;if(x>-100&&x<W){c.fillStyle='#fff';c.fillRect(x+40,14,70,5);}}
 for(let i=0;i<LW/8;i++){const x=(i*8+2)*T-cam;if(x>-100&&x<W){c.fillStyle='#8cc';c.fillRect(x,70,64,70);c.fillStyle='#dff6ff';c.fillRect(x+4,74,56,62);c.fillStyle='#8cc';c.fillRect(x+30,74,4,62);}}
 for(let i=0;i<LW/13;i++){const x=(i*13+6)*T-cam;if(x>-60&&x<W){c.fillStyle='#2e9b4f';c.fillRect(x+10,150,12,36);c.fillRect(x,162,32,12);}}
 c.fillStyle='#16242c';c.fillRect(0,10*T,W,2*T);
 const x0=Math.floor(cam/T),x1=Math.min(LW-1,x0+W/T+1);
 for(let ty=0;ty<12;ty++)for(let tx=x0;tx<=x1;tx++){const m=map[ty][tx];if(!m)continue;const x=tx*T-cam,y=ty*T;
  if(m==1){c.fillStyle=ty==10?'#6d8fa0':'#4e6d7d';c.fillRect(x,y,T,T);if(ty==10){c.fillStyle='#a9c6d3';c.fillRect(x,y,T,4);}c.fillStyle='#0003';c.fillRect(x+T-1,y,1,T);}
  else{c.fillStyle='#f4f4f4';c.fillRect(x,y,T,10);c.fillStyle='#4a90c2';c.fillRect(x,y+4,T,6);c.fillStyle='#777';c.fillRect(x+2,y+10,3,8);c.fillRect(x+T-5,y+10,3,8);}}
 // goal
 const gx=GOALX-cam;c.fillStyle='#2e9b4f';c.fillRect(gx,224,64,96);c.fillStyle='#fff';c.fillRect(gx+4,228,26,92);c.fillRect(gx+34,228,26,92);
 c.fillStyle='#2e9b4f';c.fillRect(gx+26,260,12,28);c.fillRect(gx+18,268,28,12);txt('DISCHARGE',gx+32,214,12,'#1d6b36','center');
 // pills
 for(const q of items)if(!q.got){const x=q.x-cam,y=q.y+Math.sin(t/10+q.x)*3;c.fillStyle='#d33';c.fillRect(x,y+3,8,10);c.fillStyle='#fff';c.fillRect(x+8,y+3,8,10);c.fillStyle='#0004';c.fillRect(x,y+12,16,1);}
 // enemies
 if(logo.complete&&enemies)for(const e of enemies){if(!e.alive){if(e.sq>0)c.drawImage(logo,e.x-cam,e.y+e.h-6,56,6);continue;}
  c.drawImage(logo,e.x-cam,e.y,56,20);const f=(t/8|0)%2;c.fillStyle='#234';c.fillRect(e.x-cam+8+f*4,e.y+20,10,6);c.fillRect(e.x-cam+38-f*4,e.y+20,10,6);}
 // player
 if(p){const mv=state=='play'&&p.vx&&p.on&&(t/6|0)%2;const rows=mv?HSE.slice(0,13).concat(HSE_A):HSE;spr(rows,HP,p.x-cam,p.y,2,p.face<0);}
 // HUD
 txt('HSE-MAN',10,22,16);txt('♥'.repeat(Math.max(lives,0)),10,44,18,'#ff5a6e');txt('Score '+score,W-10,22,14,'#fff','right');txt('Pills '+pills,W-10,42,14,'#fff','right');
 if(state=='dead'||state=='over')priest();
 if(state=='title'||state=='win'||(state=='over'&&deathT>130))panel();
}
function priest(){
 const k=Math.min(1,deathT/20),s=8,ph=PRIEST.length*s;
 c.fillStyle='rgba(0,0,0,'+(.55*k)+')';c.fillRect(0,0,W,H);
 spr(PRIEST,PP,W/2-48-80,H-k*(ph+10),s);
 if(deathT>20){const bx=W/2-10,by=H-ph-60;c.fillStyle='#fff';c.fillRect(bx,by,260,56);c.fillRect(bx-10,by+30,12,12);c.fillStyle='#111';c.fillRect(bx+2,by+2,256,2);c.fillRect(bx+2,by+52,256,2);
  txt('To mass with you!',bx+130,by+34,20,'#111','center');
  txt(lives>0?'Lives left: '+lives:'No lives left!',W/2+120,by+86,16);}
}
function panel(){
 c.fillStyle='rgba(10,30,40,.82)';c.fillRect(60,70,W-120,230);
 const w=state=='win',o=state=='over';
 txt(w?'DISCHARGED!':o?'GAME OVER':'HSE-MAN',W/2,130,36,w?'#6f6':'#fff','center');
 if(state=='title'){txt('Stomp the CHI blocks. Grab the pills.',W/2,170,16,'#fff','center');txt('Reach DISCHARGE. You have 5 lives.',W/2,194,16,'#fff','center');txt('(The priest is waiting.)',W/2,224,14,'#bbb','center');}
 else txt('Score '+score+'   Pills '+pills,W/2,176,20,'#fff','center');
 txt('Press Enter or tap to '+(state=='title'?'start':'play again'),W/2,274,16,'#ffd54a','center');
}
/* ---------- loop ---------- */
reset(true);state='title';
let last=performance.now(),acc=0;
(function loop(n){acc+=Math.min(100,n-last);last=n;while(acc>=16.667){if(state!='title')update();else t++;acc-=16.667;}draw();requestAnimationFrame(loop);})(last);
</script></body></html>
